name: validate

# Validates the Mintlify build on every pull request and on every push to main.
# `mint validate` runs in strict mode: it exits non-zero on a warning or an error,
# so a page missing from docs.json navigation, a broken MDX file, or a bad config
# key fails here instead of on the published site. The command needs no Mintlify
# account and reads only in-repo files, so there is no secret in this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm i -g mint
      - run: mint validate

  redaction:
    # This repo is PUBLIC. No internal host, IP, or infrastructure term may ship.
    # The control runs first: a canary in a temp dir must be found, so a broken
    # grep fails the job instead of passing it silently. Terms: HOW-TO-EDIT.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the grep detects a planted term
        run: |
          d=$(mktemp -d); printf 'nip.io\n' > "$d/canary.md"
          grep -rEl 'nip\.io' --include='*.md' "$d" | grep -q canary \
            || { echo 'control missed: the grep is broken'; exit 1; }
      - name: Fail on any infrastructure term in the repo
        run: |
          if grep -rEn 'nip\.io|az-voice-east|DATABASE_URL|Infisical|172\.208\.|5\.161\.59' \
               --include='*.mdx' --include='*.json' --include='*.md' --include='*.css' .; then
            echo 'redaction: an infrastructure term is present in a public repo'; exit 1
          fi
          echo 'redaction-clean'
